# Builds the MCP Bundle (.mcpb) and attaches it to the GitHub Release, so
# the one-click install for Claude Desktop and the Smithery listing always
# ship the released code with its dependencies inside.
#
# Runs when a GitHub Release is published, or by hand from the Actions tab
# ("Run workflow"), which leaves the bundle as a workflow artifact instead.
name: Build the MCPB bundle

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the runtime dependencies only
        run: npm install --omit=dev --no-audit --no-fund

      - name: Validate the manifest
        run: npx -y @anthropic-ai/mcpb validate manifest.json

      - name: Pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npx -y @anthropic-ai/mcpb pack . "crawl-readiness-mcp-$VERSION.mcpb"
          npx -y @anthropic-ai/mcpb info "crawl-readiness-mcp-$VERSION.mcpb"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "crawl-readiness-mcp-${VERSION}.mcpb" --clobber

      - name: Keep as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-readiness-mcp-${{ env.VERSION }}.mcpb
          path: crawl-readiness-mcp-${{ env.VERSION }}.mcpb
